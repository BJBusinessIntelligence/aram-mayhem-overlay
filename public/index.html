<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>ARAM Mayhem Overlay</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="header">
    <div class="row">
      <img id="champ-icon" alt="" hidden>
      <div id="champ-title">Waiting for League…</div>
      <div id="game-info"></div>
      <div class="spacer"></div>
      <div class="search">
        <input id="search" type="search" placeholder="Search champion…" autocomplete="off">
        <ul id="search-results" hidden></ul>
      </div>
      <button id="live-btn" hidden title="Back to detected champion">Live</button>
      <button id="refresh-btn" title="Re-fetch data">↻</button>
      <button id="capture-btn" hidden title="Save a frame + OCR result for tuning">📷 Capture</button>
    </div>
    <div class="row controls">
      <span>Stage:</span>
      <div class="tabs" id="stage-tabs">
        <button data-stage="auto">Auto</button>
        <button data-stage="all">All</button>
        <button data-stage="1">1</button>
        <button data-stage="2">2</button>
        <button data-stage="3">3</button>
        <button data-stage="4">4</button>
      </div>
      <span>Bracket:</span>
      <div class="tabs" id="bracket-tabs">
        <button data-bracket="all">All</button>
        <button data-bracket="high">High MMR</button>
      </div>
      <button id="lineup-btn" title="Try a lineup without a game">Lineup…</button>
      <div class="spacer"></div>
      <div id="meta"></div>
      <span id="ocr-chip" class="chip" hidden></span>
      <span id="import-chip" class="chip" title="Click to toggle auto-import of spells and item set" hidden></span>
    </div>
    <div id="banner" hidden></div>
  </header>
  <form id="lineup-form" hidden autocomplete="off">
    <label>Held <input name="held" placeholder="Yasuo"></label>
    <label>Bench <input name="bench" placeholder="Lux, Malphite"></label>
    <label>Allies <input name="allies" placeholder="Annie, Wukong, Morgana, Ahri"></label>
    <label>Enemies <input name="enemies" placeholder="(leave empty for champ select)"></label>
    <button type="submit">Rank</button>
    <button type="button" id="lineup-close">Close</button>
  </form>
  <section id="recommend" hidden>
    <div class="rec-head">
      <div id="rec-title">Champ select</div>
      <div id="rec-meta" class="muted"></div>
      <div class="spacer"></div>
      <button id="rec-hide">Hide</button>
    </div>
    <div id="rec-team" class="rec-team"></div>
    <div id="rec-warnings" class="muted" hidden></div>
    <div id="rec-cards" class="rec-cards"></div>
  </section>
  <section id="offer" hidden>
    <div class="offer-head">
      <div id="offer-title">Augment offer</div>
      <div id="offer-meta" class="muted"></div>
      <div class="spacer"></div>
      <button id="offer-dismiss">Show list</button>
    </div>
    <div id="offer-note" class="offer-note" hidden></div>
    <div id="offer-cards" class="offer-cards"></div>
  </section>
  <main id="main">
    <section class="col" id="col-prismatic"><h2 class="prismatic">Prismatic</h2><div class="rows"></div></section>
    <section class="col" id="col-gold"><h2 class="gold">Gold</h2><div class="rows"></div></section>
    <section class="col" id="col-silver"><h2 class="silver">Silver</h2><div class="rows"></div></section>
    <section class="col build" id="col-build"><h2>Build</h2><div id="build"></div></section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
